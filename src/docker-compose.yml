services:
  bazardb:
    container_name: bazardb
    image: postgres:16.4
    environment:
      POSTGRES_DB: db_bazar
      POSTGRES_USER: bazar_user
      POSTGRES_PASSWORD: bazar_pass
    networks:
      - test_net
    ports:
      - "5432:5432"

  bazarweb:
    container_name: bazarweb
    build: .
    command: python manage.py runserver 0.0.0.0:4000
    volumes:
      - .:/code
    ports:
      - "4000:4000"
    depends_on:
      - bazardb
    networks:
      - test_net
    env_file:
      - .env.dev

  redis:
    container_name: bazar_redis
    image: redis:7.4-alpine
    ports:
      - "6379:6379"

  celery:
    container_name: celery
    build: .
    command: celery -A config worker -l info
    volumes:
      - .:/code
    depends_on:
      - bazardb
      - redis
    env_file:
      - .env.dev
    networks:
      - test_net

  pgadmin:
    container_name: bazar_pgadmin_container
    image: dpage/pgadmin4
    restart: always
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    depends_on:
      - bazardb
    networks:
      - test_net

  bazar_test:
    profiles: ["test"]
    build: .
    command: python manage.py test
    volumes:
      - .:/code
    depends_on:
      - bazardb
    env_file:
      - .env.dev
    networks:
        - test_net

  node_exporter:
    image: prom/node-exporter:latest
    container_name: bazar_node_exporter
    ports:
      - "9100:9100"
    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge
  test_net:
    driver: bridge

volumes:
  grafana-storage:
  grafana_data: